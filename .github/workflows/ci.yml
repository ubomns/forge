name: CI

# Matches the dev→main branch model:
#  - feature/* → dev   (PR runs the full gate)
#  - dev → main        (release PR re-runs the full gate; human approval at G5
#                       is enforced by branch protection, not by this workflow)
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Frontend: lint → type-check → build (deployment-workflow stages 3–7) ──
  frontend:
    name: Frontend (lint · type-check · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build

  # ── Backend: install deps → byte-compile → import smoke ──
  backend:
    name: Backend (compile · import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Byte-compile (syntax gate)
        run: python -m compileall -q api
      - name: Import smoke test
        # The app reads OPENAI_API_KEY at request time, not import time, so a
        # placeholder is enough to confirm the FastAPI app object loads cleanly.
        env:
          OPENAI_API_KEY: ci-placeholder-not-used
        run: python -c "import api.index; print('FastAPI app import OK')"

  # ── Security & dependency scan (informational; security-engineer is the gate) ──
  security:
    name: Security scan (audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        # Non-blocking: surfaces advisories without blocking the PR. The
        # security-engineer audit is the enforcing gate at G5.
        continue-on-error: true
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

  # ── E2E: Playwright (the OpenAI full-flow test stays gated via RUN_FULL_FLOW) ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: npm ci
      - name: Install Python deps (FastAPI backend)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start FastAPI (background)
        # Playwright's webServer only starts `next dev`; the dev API proxy
        # forwards /api/* to FASTAPI_URL. Start FastAPI so non-gated tests that
        # touch the proxy work. Placeholder key → the gated full-flow test
        # (RUN_FULL_FLOW unset) is skipped, so no real OPENAI_API_KEY is needed.
        env:
          OPENAI_API_KEY: ci-placeholder-not-used
        run: |
          python -m uvicorn api.index:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Run Playwright tests
        # CI=true is set automatically by Actions → forbidOnly + 2 retries
        # (per playwright.config.ts). RUN_FULL_FLOW is intentionally unset.
        env:
          FASTAPI_URL: http://localhost:8000
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
